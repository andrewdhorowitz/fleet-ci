# Fleet CI — the repo-template kit's baseline CI as a REUSABLE workflow
# (kit v3.6, central-CI migration; published host moved in v3.6.1).
# This file is the single source of truth for the fleet's baseline
# checks. The PUBLISHED copy lives in the PUBLIC repo
# andrewdhorowitz/fleet-ci at .github/workflows/fleet-ci.yml, and each
# fleet repo carries only a thin caller (its .github/workflows/ci.yml
# is ~15 lines:
# `uses: andrewdhorowitz/fleet-ci/.github/workflows/fleet-ci.yml@main`).
# The host is public because GitHub's rule is absolute: a PUBLIC
# repository can call only public-hosted reusable workflows (a private
# host's Actions access policy helps only private callers). A kit fix
# lands HERE, once; re-seed the host by copying this file over its
# copy, and every caller picks it up on its next run — no per-repo
# workflow update runs. (The bootstrap copy installed in
# repo-template's .github/workflows/ during v3.6 is inert since
# v3.6.1: private, and no caller points at it.)
#
# Jobs run in the CALLER's context: each job's checkout step checks out
# the caller repo, exactly as when this file was copied per-repo.
# Jobs: Python (ruff + byte-compile), Web (JS syntax + HTML
# validation), and Workflows (actionlint — the workflow files lint
# themselves; the binary is pinned and downloaded from the official
# release rather than run through a third-party action). Every step
# whose files are absent skips cleanly instead of failing. Checks run
# AFTER push (no branch locks), per the owner's no-lockout rule.
#
# SYNC: the copy at .github/workflows/fleet-ci.yml in the fleet-ci
# repo is generated from the kit source at ci-src/fleet-ci.yml (this
# file) — the seed/update procedure copies it byte-for-byte; edit the
# source, re-copy, and the two never drift.
name: Fleet CI

on:
  workflow_call:
    inputs:
      py_files:
        description: "Space-separated Python files the Python job should check"
        required: false
        default: "app.py main.py"
        type: string

jobs:
  python:
    name: Python — ruff + byte-compile
    runs-on: ubuntu-latest
    env:
      PY_FILES: ${{ inputs.py_files }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Keep only the listed files that exist
        run: |
          existing=""
          for f in $PY_FILES; do [ -f "$f" ] && existing="$existing $f"; done
          echo "PY_EXISTING=$existing" >> "$GITHUB_ENV"
          if [ -z "$existing" ]; then echo "No listed Python files present — Python checks will skip."; fi
      - name: Install ruff (pinned to the audited version)
        if: env.PY_EXISTING != ''
        run: pip install "ruff==0.15.20"
      - name: Ruff check (baseline in ruff.toml)
        if: env.PY_EXISTING != ''
        run: ruff check $PY_EXISTING
      - name: Byte-compile
        if: env.PY_EXISTING != ''
        run: python -m py_compile $PY_EXISTING
      - name: Ruff format
        if: env.PY_EXISTING != ''
        run: ruff format --check $PY_EXISTING

  web:
    name: Web — JS syntax + HTML validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Syntax-check the middleware, if present (ES module)
        run: |
          if [ -f functions/_middleware.js ]; then
            cp functions/_middleware.js /tmp/_middleware.mjs
            node --check /tmp/_middleware.mjs
          else
            echo "No functions/_middleware.js — skipping."
          fi
      - name: Syntax-check index.html's inline scripts, if present
        run: |
          if [ -f index.html ]; then
            python3 - <<'PY'
          import re, pathlib
          html = pathlib.Path("index.html").read_text()
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          for i, s in enumerate(scripts):
              pathlib.Path(f"/tmp/inline-{i}.js").write_text(s)
          print(f"extracted {len(scripts)} inline script(s)")
          PY
            for f in /tmp/inline-*.js; do [ -e "$f" ] || continue; node --check "$f"; done
          else
            echo "No index.html — skipping."
          fi
      - name: Validate HTML, if index.html is present
        run: |
          if [ -f index.html ]; then
            # Respect a repo-carried config (a repo may tune rules its
            # markup style needs — e.g. Family Routines); only write
            # the stock one when the repo has none. (Before v3.6 this
            # step overwrote the repo's config unconditionally.)
            if [ ! -f .htmlvalidate.json ]; then
              printf '{ "extends": ["html-validate:recommended"] }' > .htmlvalidate.json
            fi
            npx --yes html-validate@9 index.html
          else
            echo "No index.html — skipping."
          fi

  actionlint:
    name: Workflows — actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download actionlint (pinned v1.7.11, official release)
        run: |
          if ls .github/workflows/*.yml .github/workflows/*.yaml >/dev/null 2>&1; then
            curl -sSfL -o /tmp/actionlint.tar.gz \
              https://github.com/rhysd/actionlint/releases/download/v1.7.11/actionlint_1.7.11_linux_amd64.tar.gz
            tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
            echo "ACTIONLINT_BIN=/tmp/actionlint" >> "$GITHUB_ENV"
          else
            echo "No workflow files present — actionlint will skip."
          fi
      - name: Lint the workflow files
        if: env.ACTIONLINT_BIN != ''
        run: |
          "$ACTIONLINT_BIN" -color
